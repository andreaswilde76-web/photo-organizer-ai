[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-organizer-ai"
version = "0.1.0"
description = "Local, AI-assisted photo & video organizer that sorts media into Year/Month/Event folders."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andreas Wilde" }]
keywords = ["photos", "ai", "vision", "ollama", "exif", "clustering", "pyside6"]

# Core runtime dependencies (pure logic + metadata + AI clients).
# Heavy / optional extras live in the optional-dependencies section below so
# the core library and its unit tests remain installable everywhere.
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "numpy>=1.26",
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dateutil>=2.9",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
exif = ["ExifRead>=3.0"]
geo = ["reverse_geocoder>=1.5.1"]
faces = ["face-recognition>=1.3.0"]
openai = ["openai>=1.30"]
raw = ["rawpy>=0.19"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
photo-organizer = "photo_organizer.__main__:main"
photo-organizer-gui = "photo_organizer.gui.app:main"

[project.urls]
Homepage = "https://github.com/andreaswilde76-web/photo-organizer-ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photo_organizer = ["py.typed"]

# --------------------------------------------------------------------------- #
# Tooling configuration
# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "B008", # function call in default argument (used intentionally for config factories)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.12"
packages = ["photo_organizer"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Optional heavy third-party libraries ship without type stubs.
[[tool.mypy.overrides]]
module = [
    "PIL.*",
    "pillow_heif.*",
    "exifread.*",
    "reverse_geocoder.*",
    "face_recognition.*",
    "rawpy.*",
    "openai.*",
    "tqdm.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
